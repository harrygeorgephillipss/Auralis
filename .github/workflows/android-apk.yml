name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Check out Auralis and pinned upstream source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Accept Android SDK licences
        run: yes | flutter doctor --android-licenses

      - name: Validate Android preparation script
        run: python3 -m py_compile scripts/prepare_android.py

      - name: Generate Android host project
        run: flutter create --platforms=android --org com.auralis --project-name auralis .

      - name: Configure Android 9+ app, permissions, icon and media service
        run: python3 scripts/prepare_android.py

      - name: Prepare Mornye audio plugin for standalone path dependency
        run: |
          sed -i '/^resolution: workspace$/d' upstream/mornye/third_party/audioplayers_android/pubspec.yaml

      - name: Set Android SDK and build tools required by pinned audio plugins
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' android/app/build.gradle.kts
          grep -q 'compileSdk = 36' android/app/build.gradle.kts
          sed -i 's/compileSdk = 37/compileSdk = 36/' upstream/mornye/third_party/audio_service/android/build.gradle.kts
          sed -i 's/compileSdk 37/compileSdk 36/' upstream/mornye/third_party/audioplayers_android/android/build.gradle
          sed -i 's/1.19.1/1.17.0/g; s/1.8.0/1.7.0/g' upstream/mornye/third_party/audio_service/android/build.gradle.kts upstream/mornye/third_party/audioplayers_android/android/build.gradle

      - name: Use installed Android SDK 36 with compatible AndroidX dependencies
        run: echo "Using runner-provided Android SDK 36"

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze app
        run: flutter analyze lib test

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: auralis-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
