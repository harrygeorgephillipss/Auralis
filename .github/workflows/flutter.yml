name: Flutter checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Format Auralis Dart sources
        run: dart format lib test

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Prepare Mornye audio plugin for standalone path dependency
        run: sed -i '/^resolution: workspace$/d' upstream/mornye/third_party/audioplayers_android/pubspec.yaml

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Auralis-owned Dart code
        run: flutter analyze lib test

      - name: Run widget and unit tests
        run: flutter test --reporter expanded
